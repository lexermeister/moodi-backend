services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RECORDINGS_DIR: /app/data/recordings
      MAX_UPLOAD_MB: 100
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-transcribe-diarize}
      OPENAI_ROLE_ATTRIBUTION_MODEL: ${OPENAI_ROLE_ATTRIBUTION_MODEL:-gpt-4o-mini}
    volumes:
      - moodi_recordings:/app/data/recordings

volumes:
  moodi_recordings:

